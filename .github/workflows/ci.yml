name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        working-directory: Packages/GlideKit
        run: swift test
      - name: Build the app unsigned
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Glide.xcodeproj -scheme Glide -configuration Debug -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build -quiet
