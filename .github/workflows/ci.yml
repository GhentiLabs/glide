name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # MLX's GPU kernels need the Metal toolchain, and only xcodebuild bundles them for tests.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Package tests
        working-directory: Packages/GlideKit
        run: xcodebuild -scheme GlideKit-Package -destination 'platform=macOS' -derivedDataPath ../../build/pkg test -quiet
      - name: Build the app unsigned
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Glide.xcodeproj -scheme Glide -configuration Debug -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build -quiet
