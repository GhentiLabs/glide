[build.env]
passthrough = [
    "SHERPA_ONNX_ARCHIVE_DIR",
    "SHERPA_ONNX_LIB_DIR",
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes pkg-config libasound2-dev libfontconfig1-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config libasound2-dev:arm64 libfontconfig1-dev:arm64 libwayland-dev:arm64 libx11-dev:arm64 libxcb-render0-dev:arm64 libxcb-shape0-dev:arm64 libxcb-xfixes0-dev:arm64 libxcb1-dev:arm64 libxkbcommon-dev:arm64 libxkbcommon-x11-dev:arm64",
]
